plugins{
    id'java-library'
    id'idea'
    id'net.neoforged.moddev'version'2.0.148'
}
version=mod_version
group=mod_group_id
base{
    archivesName=mod_id
}
java.toolchain.languageVersion=JavaLanguageVersion.of(21)
neoForge{
    version = neo_version
    parchment{
        minecraftVersion=minecraft_version
        mappingsVersion=mapping_version
    }
    mods{
        "${mod_id}"{
            sourceSet(project.sourceSets.main)
        }
    }
    runs{
        configureEach{
            systemProperty'neoforge.logging.markers','REGISTRIES'
            systemProperty'neoforge.logging.console.level','debug'
        }
        client{
            client()
            gameDirectory=file('runs/client')
            systemProperty'neoforge.enabledGameTestNamespaces',project.mod_id
            if(project.hasProperty('world')){
                programArguments.addAll'--quickPlaySingleplayer',project.property('world').toString()
            }
        }
        server {
            server()
            gameDirectory=file('runs/server')
            programArgument'--nogui'
            systemProperty'neoforge.enabledGameTestNamespaces',project.mod_id
        }
        gameTestServer{
            type='gameTestServer'
            gameDirectory=file('runs/gametest')
            systemProperty'neoforge.enabledGameTestNamespaces',project.mod_id
        }
        data{
            data()
            gameDirectory=file('runs/data')
            programArguments.addAll'--mod',project.mod_id,'--all','--output',file('src/generated/resources/').getAbsolutePath(),'--existing',file('src/main/resources/').getAbsolutePath()
        }
    }
}
sourceSets.main.resources{ srcDir 'src/generated/resources'}
repositories{
    mavenCentral()
    exclusiveContent{
        forRepository{
            maven{
                url="https://maven.ryanhcode.dev/releases"
            }
        }
        filter{
            includeGroup("dev.ryanhcode.sable")
            includeGroup("dev.ryanhcode.sable-companion")
        }
    }
    maven{
        name="ParchmentMC"
        url="https://maven.parchmentmc.org"
    }
    maven{
        name='Curios maven'
        url="https://maven.theillusivec4.top/"
    }
    maven{
        url="https://cursemaven.com/"
    }
    maven{
        url='https://maven.blamejared.com/'
    }
    maven{
        url="https://modmaven.dev/"
    }
    maven{
        url="https://maven.createmod.net/"
    }
}
dependencies{
    //Create
    implementation "curse.maven:create-328085:7963363"
    //JEI
    compileOnly ("mezz.jei:jei-${minecraft_version}-common-api:${jei_version}")
    compileOnly ("mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}")
    runtimeOnly ("mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}")
    // Other:
    runtimeOnly "curse.maven:curios-continuation-1037991:5888964"
    runtimeOnly "curse.maven:jade-324717:7545219"
    runtimeOnly "curse.maven:mouse-tweaks-60089:5637846"
    runtimeOnly "curse.maven:appleskin-248787:7854442"
    runtimeOnly "curse.maven:worldedit-225608:5830452"
    runtimeOnly fileTree(dir:'libs',include:['*.jar'])
    implementation fileTree(dir:'sourceLibs',include:['*.jar'])
}
tasks.named('processResources',ProcessResources).configure{
    var replaceProperties=[
            minecraft_version:minecraft_version,
            minecraft_version_range:minecraft_version_range,
            neo_version:neo_version,
            neo_version_range:neo_version_range,
            loader_version_range:loader_version_range,
            mod_id:mod_id,
            mod_name:mod_name,
            mod_license:mod_license,
            mod_version:mod_version,
            mod_authors:mod_authors,
            mod_description:mod_description,
    ]
    inputs.properties replaceProperties
    filesMatching(['META-INF/neoforge.mods.toml','pack.mcmeta']){
        expand replaceProperties
    }
}
tasks.named('jar',Jar).configure{
    manifest{
        attributes([
                "Specification-Title":mod_id,
                "Specification-Vendor":mod_authors,
                "Specification-Version":"1",
                "Implementation-Title":project.name,
                "Implementation-Version":project.jar.archiveVersion,
                "Implementation-Vendor":mod_authors,
                "Implementation-Timestamp":new Date().format("yyyy-MM-dd'T'HH:mm:ssZ")
        ])
    }
}
tasks.withType(JavaCompile).configureEach{
    options.encoding='UTF-8'
}
